[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qodalis-cli-server-plugin-config-redis"
version = "1.0.0b35"
description = "Redis config store for Qodalis CLI servers: writable settings of the config providers kept in Redis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Nicolae Lupei", email = "nicolae.lupei@qodalis.com" },
]
keywords = ["cli", "qodalis", "config", "redis", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "qodalis-cli-server-abstractions>=1.0.0b31",
    "redis>=5",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.21", "httpx>=0.24"]

[project.entry-points."qodalis_cli.plugins"]
config-redis = "qodalis_cli_config_redis.plugin:create_plugin"

[project.urls]
Homepage = "https://github.com/qodalis-solutions/cli-server-python"
Repository = "https://github.com/qodalis-solutions/cli-server-python"
Issues = "https://github.com/qodalis-solutions/cli-server-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["qodalis_cli_config_redis"]

[tool.hatch.build.targets.sdist]
include = ["qodalis_cli_config_redis/**", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
