[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qodalis-cli-server-plugin-filesystem-sqlite"
version = "1.0.0b33"
description = "SQLite-based storage provider for the Qodalis CLI filesystem plugin"
readme = { text = "", content-type = "text/plain" }
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Nicolae Lupei", email = "nicolae.lupei@qodalis.com" },
]
keywords = ["cli", "qodalis", "filesystem", "sqlite", "storage", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "qodalis-cli-server-abstractions>=1.0.0b17",
    "qodalis-cli-server-plugin-filesystem",
    "qodalis-cli-server-plugin-databases>=1.0.0b29",
]

[project.entry-points."qodalis_cli.plugins"]
filesystem-sqlite = "qodalis_cli_filesystem_sqlite.plugin:create_plugin"

[project.urls]
Homepage = "https://github.com/qodalis-solutions/cli-server-python"
Repository = "https://github.com/qodalis-solutions/cli-server-python"
Issues = "https://github.com/qodalis-solutions/cli-server-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["qodalis_cli_filesystem_sqlite"]

[tool.hatch.build.targets.sdist]
include = ["qodalis_cli_filesystem_sqlite/**"]
