name: Publish to PyPI

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test tools
        run: pip install build pytest pytest-asyncio httpx

      - name: Install packages for testing
        run: |
          pip install ./packages/abstractions
          pip install ./plugins/filesystem
          pip install ./plugins/filesystem-json
          pip install ./plugins/databases
          pip install ./plugins/filesystem-sqlite
          pip install ./plugins/filesystem-s3
          pip install ./plugins/weather
          pip install ./plugins/jobs
          pip install ./plugins/audit
          pip install ./plugins/users
          pip install ./plugins/admin
          pip install ./plugins/public-api
          pip install ./plugins/docs
          # Editable: the portal's wheel needs the portal site, bundled further down.
          pip install -e ./plugins/portal
          pip install ./plugins/aws
          pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest tests/ plugins/aws/tests/ -v

      - name: Build abstractions package
        run: python -m build packages/abstractions/ --outdir dist-abstractions/

      - name: Publish abstractions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist-abstractions/
          skip-existing: true
          verbose: true
          attestations: false

      - name: Build server package
        run: python -m build

      - name: Publish server to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
          verbose: true
          attestations: false

      # -- Plugin packages --

      # The wheels embed the dashboard's pages of their APIs, from the npm packages @qodalis/cli-dashboard-module-*
      - name: Embed the dashboard pages
        run: |
          for pair in jobs:jobs:qodalis_cli_jobs audit:audit:qodalis_cli_audit \
                      filesystem:filesystem:qodalis_cli_filesystem data-explorer:data-explorer:qodalis_cli_data_explorer; do
            IFS=: read -r plugin module package <<< "$pair"
            npm install --no-save --no-package-lock --ignore-scripts --prefix plugins/$plugin @qodalis/cli-dashboard-module-$module
            python plugins/$plugin/scripts/copy_dashboard.py
            test -f plugins/$plugin/$package/dashboard/extension.js
          done
          # The users plugin: API tokens, and Users + Account (one build, @qodalis/cli-dashboard-module-users)
          npm install --no-save --no-package-lock --ignore-scripts --prefix plugins/users @qodalis/cli-dashboard-module-tokens @qodalis/cli-dashboard-module-users
          python plugins/users/scripts/copy_dashboard.py
          test -f plugins/users/qodalis_cli_users/dashboard/extension.js
          test -f plugins/users/qodalis_cli_users/dashboard_users/extension.js

      - name: Build filesystem plugin
        run: |
          python -m build plugins/filesystem/ --outdir dist-plugin-filesystem/
          python -m zipfile -l dist-plugin-filesystem/*.whl | grep -q "qodalis_cli_filesystem/dashboard/extension.js"

      - name: Publish filesystem plugin to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist-plugin-filesystem/
          skip-existing: true
          verbose: true
          attestations: false

      - name: Build filesystem-json plugin
        run: python -m build plugins/filesystem-json/ --outdir dist-plugin-filesystem-json/

      - name: Publish filesystem-json plugin to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist-plugin-filesystem-json/
          skip-existing: true
          verbose: true
          attestations: false

      # The wheel embeds the dashboard's Databases page from the npm package @qodalis/cli-dashboard-module-databases
      - name: Build databases plugin
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --prefix plugins/databases @qodalis/cli-dashboard-module-databases
          python plugins/databases/scripts/copy_dashboard.py
          test -f plugins/databases/qodalis_cli_databases/dashboard/extension.js
          python -m build plugins/databases/ --outdir dist-plugin-databases/
          python -m zipfile -l dist-plugin-databases/*.whl | grep -q "qodalis_cli_databases/dashboard/extension.js"

      - name: Publish databases plugin to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist-plugin-databases/
          skip-existing: true
          verbose: true
          attestations: false

      - name: Build filesystem-sqlite plugin
        run: python -m build plugins/filesystem-sqlite/ --outdir dist-plugin-filesystem-sqlite/

      - name: Publish filesystem-sqlite plugin to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist-plugin-filesystem-sqlite/
          skip-existing: true
          verbose: true
          attestations: false

      - name: Build filesystem-s3 plugin
        run: python -m build plugins/filesystem-s3/ --outdir dist-plugin-filesystem-s3/

      - name: Publish filesystem-s3 plugin to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist-plugin-filesystem-s3/
          skip-existing: true
          verbose: true
          attestations: false

      - name: Build weather plugin
        run: python -m build plugins/weather/ --outdir dist-plugin-weather/

      - name: Publish weather plugin to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist-plugin-weather/
          skip-existing: true
          verbose: true
          attestations: false

      - name: Build jobs plugin
        run: |
          python -m build plugins/jobs/ --outdir dist-plugin-jobs/
          python -m zipfile -l dist-plugin-jobs/*.whl | grep -q "qodalis_cli_jobs/dashboard/extension.js"

      - name: Publish jobs plugin to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist-plugin-jobs/
          skip-existing: true
          verbose: true
          attestations: false

      # Before the users plugin, which depends on it.
      - name: Build audit plugin
        run: |
          python -m build plugins/audit/ --outdir dist-plugin-audit/
          python -m zipfile -l dist-plugin-audit/*.whl | grep -q "qodalis_cli_audit/dashboard/extension.js"

      - name: Publish audit plugin to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist-plugin-audit/
          skip-existing: true
          verbose: true
          attestations: false

      - name: Build users plugin
        run: |
          python -m build plugins/users/ --outdir dist-plugin-users/
          python -m zipfile -l dist-plugin-users/*.whl | grep -q "qodalis_cli_users/dashboard/extension.js"
          python -m zipfile -l dist-plugin-users/*.whl | grep -q "qodalis_cli_users/dashboard_users/extension.js"

      - name: Publish users plugin to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist-plugin-users/
          skip-existing: true
          verbose: true
          attestations: false

      - name: Build aws, public API, docs and data explorer plugins
        run: |
          for plugin in aws public-api docs data-explorer data-explorer-sql data-explorer-postgres data-explorer-mysql \
                        data-explorer-mssql data-explorer-mongo data-explorer-redis data-explorer-elasticsearch; do
            python -m build plugins/$plugin/ --outdir dist-plugins/
          done
          python -m zipfile -l dist-plugins/qodalis_cli_server_plugin_data_explorer-*.whl | grep -q "qodalis_cli_data_explorer/dashboard/extension.js"

      - name: Publish aws, public API, docs and data explorer plugins to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist-plugins/
          skip-existing: true
          verbose: true
          attestations: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The wheel embeds the dashboard SPA from the npm package @qodalis/cli-server-dashboard
      - name: Bundle the dashboard into the admin plugin
        run: |
          npm ci --ignore-scripts --prefix plugins/admin
          python plugins/admin/scripts/copy_dashboard.py
          test -f plugins/admin/qodalis_cli_admin/dashboard/index.html

      - name: Build admin plugin
        run: |
          python -m build plugins/admin/ --outdir dist-plugin-admin/
          python -m zipfile -l dist-plugin-admin/*.whl | grep -q "qodalis_cli_admin/dashboard/index.html"

      - name: Publish admin plugin to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist-plugin-admin/
          skip-existing: true
          verbose: true
          attestations: false

      # The wheel embeds the portal site from the npm package @qodalis/cli-server-portal
      - name: Bundle the portal site into the portal plugin
        run: |
          npm ci --ignore-scripts --prefix plugins/portal
          python plugins/portal/scripts/copy_portal.py
          test -f plugins/portal/qodalis_cli_portal/site/index.html

      - name: Build portal plugin
        run: |
          python -m build plugins/portal/ --outdir dist-plugin-portal/
          python -m zipfile -l dist-plugin-portal/*.whl | grep -q "qodalis_cli_portal/site/index.html"

      - name: Publish portal plugin to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: dist-plugin-portal/
          skip-existing: true
          verbose: true
          attestations: false

  docker:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
